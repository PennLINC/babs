# config_simbids.yaml plus a `templateflow:` section, for the walkthrough only:
# its source exists only inside the walkthrough, so the unit-test fixtures
# (which use config_simbids.yaml) must not carry it.
input_datasets:
    BIDS:
        required_files:
            - "anat/*_T1w.nii*"
        is_zipped: false
        origin_url: "/test-temp/simbids"
        path_in_babs: inputs/data/BIDS

templateflow:
    url: "/test-temp/templateflow-fake"
    required:
        - "tpl-MNI152NLin6Asym/*_T1w.nii.gz"

bids_app_args:
    --bids-app: "fmriprep"
    $SUBJECT_SELECTION_FLAG: "--participant-label"
    --stop-on-first-crash: ""
    -vv: ""
    --anat-only: ""

all_results_in_one_zip: true
zip_foldernames:
    fmriprep_anat: "24-1-1"

singularity_args:
    - --containall
    - --writable-tmpfs

cluster_resources:
    interpreting_shell: "/bin/bash"

script_preamble: |
    PATH=/opt/conda/envs/babs/bin:$PATH

job_compute_space: "/tmp"

alert_log_messages:
    stdout:
        - "Excessive topologic defect encountered"
        - "Cannot allocate memory"
        - "mris_curvature_stats: Could not open file"
        - "Numerical result out of range"
        - "fMRIPrep failed"
